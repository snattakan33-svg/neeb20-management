<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>หนีบ20 จับเวลา</title><style>
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#fff3f8;color:#45283a;margin:0;padding:15px}header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}h1{margin:5px 0;color:#cb267a}.total{background:white;border-radius:15px;padding:15px;margin:15px 0;font-size:23px}.total b{font-size:42px;color:#d52c80}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.station{background:white;border:2px solid #f1b6d2;border-radius:15px;padding:13px}.station.warn{background:#fff8e5;border-color:orange}.station.expired{background:#ffedef;border-color:#e03c53}.station.pause{background:#f0eaff;border-color:#9670cf}h2{margin:0}.time{font-size:43px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:10px 0}.status{text-align:center;margin-bottom:10px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px}button{font:inherit;font-weight:700;border:0;border-radius:9px;min-height:43px;padding:8px;background:#f3e2ed;color:#7d2552}button:disabled{opacity:.3}.start{background:#d93283;color:white;grid-column:span 2}.panel{background:white;border-radius:15px;padding:15px;margin-top:18px;overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:8px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}.note{font-size:12px;color:#765f6d;line-height:1.7}select{padding:12px;font-size:18px}
</style><header><h1>💗 หนีบ20 จับเวลา</h1><span>12 สเตชัน · 25 นาที</span></header><div id="date"></div><div class="total">วันนี้เริ่มจับเวลาแล้ว <b id="count">0</b> คน</div><div class="grid" id="grid"></div><section class="panel"><h2>ประวัติวันนี้</h2><button id="backup">สำรองข้อมูล</button><table><thead><tr><th>คนที่</th><th>เวลาเริ่ม</th><th>จุดที่ใช้</th><th>เพิ่มเวลา</th><th>สถานะ</th></tr></thead><tbody id="history"></tbody></table></section><p class="note">ข้อมูลอยู่ใน Safari ของ iPad เครื่องนี้เท่านั้น โปรดอย่าใช้โหมดส่วนตัว และควรสำรองข้อมูลทุกวัน · เมื่อปิดหน้าเว็บ เสียงเตือนจะไม่ทำงาน แต่เวลาจะคำนวณต่อเมื่อเปิดกลับมา</p>
<script>
const K='neeb20-12-web-v1',BASE=1500000,PLUS=300000,WARN=180000;
const day=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const blank=()=>({end:null,paused:false,left:0,warn:false,alarm:false,id:null});
let d;try{d=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!d||!Array.isArray(d.s))d={day:day(),count:0,seq:0,s:Array.from({length:12},blank),history:[]};
d.s=Array.from({length:12},(_,i)=>d.s[i]||blank());d.history=d.history||[];
const save=()=>{try{localStorage.setItem(K,JSON.stringify(d))}catch(e){alert('ไม่สามารถบันทึกข้อมูลใน Safari ได้')}};
function rollover(){if(d.day!==day()){d.day=day();d.count=0;d.seq=0;d.history=[];save()}}
function fmt(ms){ms=Math.max(0,ms);return String(Math.floor(ms/60000)).padStart(2,'0')+':'+String(Math.floor(ms%60000/1000)).padStart(2,'0')}
function hm(t){return new Intl.DateTimeFormat('th-TH',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit'}).format(new Date(t))}
let ctx;function sound(end){try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();ctx.resume();(end?[800,800,1000,1000]:[660,880]).forEach((f,i)=>{let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*.22;o.frequency.value=f;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(.13,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.start(t);o.stop(t+.19)})}catch(e){}}
const rec=s=>d.history.find(r=>r.id===s.id);
const grid=document.getElementById('grid');
for(let i=0;i<12;i++){let el=document.createElement('div');el.className='station';el.id='s'+i;el.innerHTML='<h2>สเตชัน '+(i+1)+'</h2><div class="time">25:00</div><div class="status">ว่าง</div><div class="buttons"><button class="start" data-a="start" data-i="'+i+'">เริ่มจับเวลา</button><button data-a="add" data-i="'+i+'">+5 นาที</button><button data-a="pause" data-i="'+i+'">พักเวลา</button><button data-a="move" data-i="'+i+'">ย้ายจุด</button><button data-a="end" data-i="'+i+'">จบรอบ</button></div>';grid.append(el)}
function render(){rollover();document.getElementById('date').textContent=new Intl.DateTimeFormat('th-TH',{timeZone:'Asia/Bangkok',dateStyle:'full'}).format(new Date());document.getElementById('count').textContent=d.count;let changed=false,now=Date.now();d.s.forEach((s,i)=>{let busy=s.end!==null,left=busy?(s.paused?s.left:Math.max(0,s.end-now)):BASE;if(busy&&!s.paused){if(left<=WARN&&left>0&&!s.warn){s.warn=true;changed=true;sound(false)}if(left===0&&!s.alarm){s.alarm=true;changed=true;sound(true)}}let state=!busy?'':s.paused?'pause':left===0?'expired':left<=WARN?'warn':'';let el=document.getElementById('s'+i);el.className='station '+state;el.querySelector('.time').textContent=fmt(left);el.querySelector('.status').textContent=!busy?'พร้อมเริ่ม':s.paused?'พักเวลา':left===0?'⏰ หมดเวลา':left<=WARN?'⚠️ ใกล้หมดเวลา':'กำลังใช้งาน';el.querySelector('[data-a=start]').disabled=busy;for(let a of ['add','pause','move','end'])el.querySelector('[data-a='+a+']').disabled=!busy;el.querySelector('[data-a=pause]').textContent=s.paused?'เล่นต่อ':'พักเวลา'});if(changed)save();let tbody=document.getElementById('history');tbody.replaceChildren();for(let r of [...d.history].reverse()){let tr=document.createElement('tr');for(let v of [r.n,hm(r.start),r.route.join(' → '),r.add+' นาที',r.end?'จบ '+hm(r.end):'กำลังใช้งาน']){let td=document.createElement('td');td.textContent=v;tr.append(td)}tbody.append(tr)}}
grid.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();ctx.resume()}catch(e){}rollover();let i=+b.dataset.i,a=b.dataset.a,s=d.s[i],now=Date.now();if(a==='start'){if(s.end!==null)return;d.count++;d.seq++;let id=d.day+'-'+d.seq+'-'+now;d.history.push({id,n:d.count,start:now,route:[i+1],add:0,end:null});d.s[i]={...blank(),end:now+BASE,id}}if(a==='add'){if(s.end===null)return;if(s.paused)s.left+=PLUS;else s.end=Math.max(now,s.end)+PLUS;s.warn=false;s.alarm=false;let r=rec(s);if(r)r.add+=5}if(a==='pause'){if(s.end===null)return;if(s.paused){s.end=now+s.left;s.paused=false}else{if(s.end<=now)return;s.left=s.end-now;s.paused=true}}if(a==='move'){if(s.end===null)return;let free=d.s.map((x,j)=>x.end===null?j:-1).filter(j=>j>=0);if(!free.length){alert('ไม่มีสเตชันว่าง');return}let answer=prompt('ย้ายจากจุด '+(i+1)+' ไปจุดไหน? จุดที่ว่าง: '+free.map(x=>x+1).join(', '));if(answer===null)return;let j=Number(answer)-1;if(!free.includes(j)){alert('เลือกจุดที่ว่างเท่านั้น');return}let r=rec(s);if(r)r.route.push(j+1);d.s[j]={...s};d.s[i]=blank()}if(a==='end'){if(s.end===null||!confirm('ยืนยันจบรอบสเตชัน '+(i+1)+'?'))return;let r=rec(s);if(r)r.end=now;d.s[i]=blank()}save();render()});
document.getElementById('backup').onclick=()=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.href=u;a.download='neeb20-'+d.day+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)};
save();render();setInterval(render,1000);document.addEventListener('visibilitychange',render);
</script>
